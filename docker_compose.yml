services:
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: qdrant-rag-pro
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333; printf \"GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3; head -1 <&3 | grep -q \"200 OK\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - qdrant-rag-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: greek-law-rag-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/myenv
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-nano}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-greek_law_case_rag}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_SEARCH_RESULTS=${MAX_SEARCH_RESULTS:-10}
      - DEFAULT_VECTOR_WEIGHT=${DEFAULT_VECTOR_WEIGHT:-0.7}
      - DEFAULT_KEYWORD_WEIGHT=${DEFAULT_KEYWORD_WEIGHT:-0.3}
      - MIN_SEARCH_SCORE=${MIN_SEARCH_SCORE:-0.3}
      - MAX_TOKENS_PER_CHUNK=${MAX_TOKENS_PER_CHUNK:-8192}
      - CHUNK_OVERLAP_TOKENS=${CHUNK_OVERLAP_TOKENS:-200}
      - BATCH_SIZE=${BATCH_SIZE:-100}
      - MAX_RESPONSE_TOKENS=${MAX_RESPONSE_TOKENS:-1000}
      - RESPONSE_TEMPERATURE=${RESPONSE_TEMPERATURE:-0.1}
      - MAX_SOURCES_PER_RESPONSE=${MAX_SOURCES_PER_RESPONSE:-5}
      - DEBUG=${DEBUG:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - qdrant-rag-network

  # Streamlit frontend
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      target: streamlit
    container_name: greek-law-rag-streamlit
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - /app/myenv
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-nano}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-greek_law_case_rag}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_SEARCH_RESULTS=${MAX_SEARCH_RESULTS:-10}
      - DEFAULT_VECTOR_WEIGHT=${DEFAULT_VECTOR_WEIGHT:-0.7}
      - DEFAULT_KEYWORD_WEIGHT=${DEFAULT_KEYWORD_WEIGHT:-0.3}
      - MIN_SEARCH_SCORE=${MIN_SEARCH_SCORE:-0.3}
      - MAX_TOKENS_PER_CHUNK=${MAX_TOKENS_PER_CHUNK:-8192}
      - CHUNK_OVERLAP_TOKENS=${CHUNK_OVERLAP_TOKENS:-200}
      - BATCH_SIZE=${BATCH_SIZE:-100}
      - MAX_RESPONSE_TOKENS=${MAX_RESPONSE_TOKENS:-1000}
      - RESPONSE_TEMPERATURE=${RESPONSE_TEMPERATURE:-0.1}
      - MAX_SOURCES_PER_RESPONSE=${MAX_SOURCES_PER_RESPONSE:-5}
      - DEBUG=${DEBUG:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - API_BASE_URL=http://api:8000
      - USE_API=true
    depends_on:
      qdrant:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - qdrant-rag-network

  # Development API with hot reload
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: greek-law-rag-api-dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/myenv
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-nano}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-greek_law_case_rag}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - MAX_SEARCH_RESULTS=${MAX_SEARCH_RESULTS:-10}
      - DEFAULT_VECTOR_WEIGHT=${DEFAULT_VECTOR_WEIGHT:-0.7}
      - DEFAULT_KEYWORD_WEIGHT=${DEFAULT_KEYWORD_WEIGHT:-0.3}
      - MIN_SEARCH_SCORE=${MIN_SEARCH_SCORE:-0.3}
      - MAX_TOKENS_PER_CHUNK=${MAX_TOKENS_PER_CHUNK:-8192}
      - CHUNK_OVERLAP_TOKENS=${CHUNK_OVERLAP_TOKENS:-200}
      - BATCH_SIZE=${BATCH_SIZE:-100}
      - MAX_RESPONSE_TOKENS=${MAX_RESPONSE_TOKENS:-1000}
      - RESPONSE_TEMPERATURE=${RESPONSE_TEMPERATURE:-0.1}
      - MAX_SOURCES_PER_RESPONSE=${MAX_SOURCES_PER_RESPONSE:-5}
      - DEBUG=${DEBUG:-true}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - dev
    networks:
      - qdrant-rag-network

  # Test service for running unit tests
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: greek-law-rag-tests
    user: root
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-nano}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-greek_law_case_rag}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=test
    depends_on:
      qdrant:
        condition: service_healthy
    # Run tests and exit
    command: ["python", "-m", "pytest", "tests/test_api.py", "-v", "--tb=short", "--asyncio-mode=auto"]
    profiles:
      - test
    networks:
      - qdrant-rag-network

  # Integration test service for running API tests
  integration-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: greek-law-rag-integration-tests
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-nano}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-greek_law_case_rag}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=test
      - API_BASE_URL=http://api:8000
    depends_on:
      qdrant:
        condition: service_healthy
      api:
        condition: service_healthy
    # Run integration tests against the API
    command: >
      sh -c "
        echo 'Waiting for API to be ready...' &&
        sleep 10 &&
        python -m pytest tests/test_api.py -v --tb=short -k 'integration' --asyncio-mode=auto ||
        python -c \"import httpx; import asyncio; print('Running basic API health check...'); asyncio.run(check_api())\"
      "
    profiles:
      - test
    networks:
      - qdrant-rag-network

  # Setup database service
  setup-db:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: greek-law-rag-setup-db
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-nano}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-greek_law_case_rag}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["python", "scripts/setup_database.py"]
    profiles:
      - setup
    networks:
      - qdrant-rag-network

  # Ingest documents service
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: greek-law-rag-ingest
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-nano}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-greek_law_case_rag}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["python", "scripts/ingest_documents.py", "--create-sample"]
    profiles:
      - setup
    networks:
      - qdrant-rag-network

volumes:
  qdrant_storage:
    driver: local

networks:
  qdrant-rag-network:
    name: qdrant-rag-network